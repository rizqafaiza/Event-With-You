<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Akun - Event Organizer</title>
    <!-- Menghubungkan CSS Eksternal yang sama -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="auth-card">
        <div class="auth-header">
            <h1>Buat Akun Baru</h1>
            <p>Daftar untuk mulai merencanakan momen impian Anda</p>
        </div>

        <form action="proses-register.php" method="POST">
            <div class="form-group">
                <label for="nama">Nama Lengkap</label>
                <input type="text" id="nama" name="nama" placeholder="Masukkan nama lengkap" required>
            </div>

            <div class="form-group">
                <label for="email">Email Aktif</label>
                <input type="email" id="email" name="email" placeholder="nama@email.com" required>
            </div>

            <div class="form-group">
                <label for="telepon">Nomor Telepon / WhatsApp</label>
                <input type="tel" id="telepon" name="telepon" placeholder="08xxxxxxxxxx" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Buat password aman" required>
            </div>

            <button type="submit" class="btn-primary">Daftar Sekarang</button>
        </form>

        <div class="auth-footer">
            <p>Sudah punya akun? <a href="login.html">Masuk di sini</a></p>
        </div>
        
        <a href="index.html" class="back-link">← Kembali ke Beranda Utama</a>
    </div>

</body>
</html>
